            <h2>Contact</h2>
            <form action="send_message.php" method="POST">
                <p>
                    <label for="firstname" id="contactlabel1">First Name:</label><br>
                    <input type="text" id="firstname" name="firstname">
                </p>
                <p>
                    <label for="lastname" id="contactlabel2">Last Name:</label><br>
                    <input type="text" id="lastname" name="lastname">
                </p>
                <p>
                    <label for="phone" id="contactlabel3">Phone:</label><br>
                    <input type="tel" id="phone" name="phone">
                </p>
                <p>
                    <label for="email" id="contactlabel4">Email:</label><br>
                    <input type="email" id="email" name="email"><br>
                </p>
                <br>
                <p>
                    <label for="message" id="contactlabel5">What are you interested in:</label><br>
                    <textarea id="message" name="message" placeholder="Input message here..." rows="10" cols="50">
                    </textarea>
                </p>
                <p>Best Time To Contact:</p>
                <p>
                    <label for="timezone" class="formlabel" id="contactlabel6">Time zone:</label>
                    <select id="timezone" name="timezone">
                        <option value="GMT-4">Eastern Daylight Time</option>
                        <option value="GMT-5">Central Daylight Time</option>
                        <option value="GMT-6">Mountain Daylight Time</option>
                        <option value="GMT-6">Mountain Standard Time</option>
                        <option value="GMT-7">Pacific Daylight Time</option>
                        <option value="GMT-7">Alaska Daylight Time</option>
                        <option value="GMT-8">Hawaii-Aleutian Standard Time</option>
                    </select>
                </p>
                <p>
                    <input type="radio" id="am" name="bestcontacttime" value="am">
                    <label for="am">AM</label>
                    <input type="radio" id="pm" name="bestcontacttime" value="pm">
                    <label for="pm">PM</label>
                    <input type="radio" id="anytime" name="bestcontacttime" value="anytime">
                    <label for="anytime">Anytime</label>
                </p>
                <label for="contactmethod" class="formlabel" id="contactlabel7">Preferred contact method:</label>
                <select id="contactmethod" name="contactmethod">
                    <option value="phone">Phone</option>
                    <option value="email">Email</option>
                    <option value="text">Text</option>
                </select>
                <p>
                    <label for="org-name" id="contactlabel8">Organization affiliated with:</label><br>
                    <input type="text" id="org-name" name="org-name">
                </p>
                <input class="message-submit" type="submit" value="Submit">
                <br>
                <br>
                <br>
            </form>
